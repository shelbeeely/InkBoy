; FreeInkBoy builds with PlatformIO on the FreeInk SDK: Arduino-ESP32 3.3 as an ESP-IDF 5.5
; component (the pioarduino platform the SDK uses). The C firmware stays ESP-IDF components under
; main/ and components/; components/freeink_sdk builds the vendored SDK in freeink-sdk/.

[platformio]
src_dir = main
default_envs = ws154

; Waveshare ESP32-S3-ePaper-1.54 V2 (FreeInk device WS154, set in components/freeink_sdk).
[env:ws154]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino, espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
monitor_speed = 115200
; Arduino-as-component pulls in every managed component the Arduino libraries
; might use. FreeInkBoy needs none of these, and some (RainMaker's embedded
; certificates) do not build in a hybrid project.
custom_component_remove =
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_schedule
    espressif/esp_secure_cert_mgr
    espressif/network_provisioning
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp-modbus
    espressif/esp_modem
    espressif/esp-sr
    espressif/esp-dl
    espressif/dl_fft
    espressif/esp_new_jpeg
    espressif/esp_rcp_update
    espressif/esp-serial-flasher
    espressif/qrcode
    espressif/libsodium
    espressif/mdns
    espressif/cbor
    espressif/jsmn
    espressif/json_parser
    espressif/json_generator
    chmorgan/esp-libhelix-mp3
    joltwallet/littlefs

; Test-only USB input commands (see docs/development.md). Never ship this image.
[env:ws154-diagnostics]
extends = env:ws154
board_build.cmake_extra_args = -DFREEINKBOY_DIAGNOSTICS=ON
